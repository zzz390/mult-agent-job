[project]
name = "job-agent-os"
version = "0.1.0"
description = "Multi-Agent Job Hunting System for Fall Recruitment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Job Agent OS Team" }]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # Data Validation
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # Vector Store
    "pgvector>=0.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    # HTTP Client
    "httpx>=0.27.0",
    # Web Scraping
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    # Observability
    "opentelemetry-sdk>=1.25.0",
    "langfuse>=2.0.0",
    # Template & Config
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent_os"]

# === Ruff Configuration ===
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["job_agent_os"]

# === MyPy Configuration ===
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "bs4.*",
    "yaml.*",
]
ignore_missing_imports = true

# === Pytest Configuration ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# === Coverage Configuration ===
[tool.coverage.run]
source = ["src/job_agent_os"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
